[package]
name = "serviceberry-gui"
version = "0.1.0"
authors = ["Your Name <you@example.com>"]
edition = "2021"
description = "Tauri GUI for ServiceBerry"

[[bin]]
name = "serviceberry-gui"
path = "src/main.rs"

[dependencies]
tauri = { version = "2.9.5", features = [] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = "0.3"

# Your library crate
service_berry = { path = "../service_berry" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }
